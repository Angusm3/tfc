# TFC voice sets, ported from legacy-0.32/voices.yaml. Loaded after the stock audio/voices.yaml.
# 0.32 "Move" is now "Action". Every set also defines what the 20250330 lint requires of it
# (Select, Action, Attack, Die, Burned, Zapped, Poisoned; Unload for transports), reusing the set's own sounds.
# Sound files are in audio/ (mounted as tfc|audio) except the stock nuyell*/ramyell1 files.

# The 'forgotten' faction speaks with the same sounds as gdi/nod (the .v01/.v03 variants), as in 0.32.
GenericVoice:
	Variants:
		forgotten: .v01, .v03

VehicleVoice:
	Variants:
		forgotten: .v00, .v02

HijackerVoice:
	Voices:
		Select: yeah, what, needaride
		Action: hitit, nokeysnoproblem, needaride
		Attack: hotwired, fouronthefloor
		Die: ramyell1
		Burned: ramyell1
		Zapped: ramyell1
		Poisoned: ramyell1
		# 0.32 named "jackmeup" but the file is jackemup.aud.
		Build: jackemup

