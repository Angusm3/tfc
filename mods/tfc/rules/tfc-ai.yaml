# Phase 5a: the AI. Stock 20250330 cnc defines three modular bots (Cabal, Watson, HAL 9001) in rules/ai.yaml; this file layers the
# 0.32 values and the Forgotten on top (it is the last file in mod.yaml, so it wins). See the PR description for every choice.
#
# Where 0.32 and stock agree nothing is repeated here except where it makes a list complete. Values are 0.32's (legacy-0.32/rules/ai.yaml):
#  - the HackyAI percentages are plain integers in the modular bot ('e1: 14%' is 'e1: 14'), the typo 'aslr: 10%%' is fixed to 10;
#  - 0.32's 'mlta' (the image name of the militia, no such actor) is the actor 'militia';
#  - 0.32 gave Watson and HAL 9001 Forgotten unit queues but no Forgotten units, buildings or queues to build with. They now use Cabal's Forgotten values.
#  - PowerTypes is 0.32's: nuke, nuk2, slar, aslr. Solar arrays used to make no power (the 2014 engine ignored the written value), so this
#    file capped them (BuildingLimits slar 2, aslr 1; otherwise a Forgotten AI would queue arrays forever) and delayed the tent and the
#    machine gun nest. They make power now (slar +50, aslr +100, switched on 27 Nov 2026), so all of that is gone: the modular bot builds the
#    best PowerType whenever it wants a building that would put it into low power and stops once the excess is back. Keeping the caps
#    would now strand a Forgotten AI in low power for good (200 power at most, and one Tesla Coil draws 200). The same PowerTypes
#    also make the bot hold back unit production until the first refinery stands (HasAdequateRefineryCount), which a Forgotten AI needs.
#  - Known and left alone: the defence queue cannot build power, so a bot can sit in low power for a minute or two after it builds a
#    power-hungry defence (Tesla Coil 200, Obelisk of Light 150) until its building queue and its cash catch up. It recovers by itself.
#  - Not set here, so stock cnc values stay: MinimumExcessPower and the other power options, UnitLimits (harv: 8), every delay and radius.
