# TFC: stock actors that TFC never changed, pinned back to their 2014 (0.32) values. Owner decision Q3: "remain pinned".
# Source of truth: tools/baseline-0.32-actors.csv. Only fields that differ from modern cnc are written.
# Units: HP x100, turn speeds x4 (255 becomes 1023), ranges as WDist, speeds, costs and build orders unchanged.
# Nothing here edits a template; rendering, sounds, strings and modern-only traits stay as stock 20250330.
# Build time: modern stock BuildDuration is reset to -1 (0.6 x cost, as 2014 had it) where it set one.
# Terrain speeds are pinned on World by lane 4e (rules/tfc-overrides.yaml), not here.
# A death explosion that 2014 lacked is removed with -FireWarheadsOnDeath; the weapons are lane 4d's.

