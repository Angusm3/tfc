# Modern disguise mechanics (Q: owner chose "use modern mechanics"): Ivan copies another infantry unit until he attacks.
IVAN:
	Inherits: ^Soldier
	Inherits@selection: ^SelectableSupportUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Valued:
		Cost: 0
	-Tooltip:
	DisguiseTooltip:
		Name: actor-ivan.name
		GenericName: meta-soldier-generic-name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 120
		BuildLimit: 1
		Description: actor-ivan.description
	RenderSprites:
		Image: ivan
	Mobile:
		Speed: 71
	Health:
		HP: 50000
	Passenger:
		CustomPipType: red
	RevealsShroud:
		Range: 6c0
	DetectCloaked:
		Range: 1c0
	Demolition:
		DetonationDelay: 15
	-AttackFrontal:
	Cloak:
		InitialDelay: 100
		CloakDelay: 25
		CloakStyle: Palette
		CloakedPalette: cloak
		UncloakOn: Attack, Unload, Infiltrate, Demolish, Dock, Move
	Disguise:
		DisguisedCondition: disguise
	-WithInfantryBody:
	WithDisguisingInfantryBody:
		DefaultAttackSequence: shoot
		IdleSequences: idle1,idle2,idle3
		StandSequences: stand,stand2
	WithDecoration@disguise:
		Image: pips
		Sequence: pip-gray
		Position: Top
		RequiresCondition: disguise
	Voiced:
		VoiceSet: IvanVoice
