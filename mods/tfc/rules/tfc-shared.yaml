# Lane 4e: TFC actors that belong to no faction (design note 2.2). In 0.32 these five commandos were work in progress:
# no art, no build queue (cost 0, at most 1). Question Q-E default (a): they are ported unbuildable and use the stock
# Commando art (image rmbo) as a placeholder, so that the stats check is complete and the lint passes.

TANYA:
	Inherits: ^Soldier
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Valued:
		Cost: 0
	Tooltip:
		Name: actor-tanya.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 120
		BuildLimit: 1
		Description: actor-tanya.description
	RenderSprites:
		Image: tanya
	Mobile:
		Speed: 71
	Health:
		HP: 50000
	Passenger:
		CustomPipType: red
	RevealsShroud:
		Range: 6c0
	DetectCloaked:
		Range: 1c0
	AutoTarget:
		ScanRadius: 4
	Demolition:
		DetonationDelay: 45
	Armament@PRIMARY:
		Weapon: Colt45
	Armament@SECONDARY:
		Name: secondary
		Weapon: Colt45
	WithInfantryBody:
		DefaultAttackSequence: shoot
		IdleSequences: idle1,idle2,idle3
	Voiced:
		VoiceSet: TanyaVoice

