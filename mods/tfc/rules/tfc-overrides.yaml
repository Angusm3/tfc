# Veterancy: the 2014 four levels and multipliers for every unit (design note 3.6, question Q-D default (a)).
# Removals of the stock keys appear here only; no other file may remove them.
^GainsExperience:
	GainsExperience:
		Conditions:
			-250:
			-500:
			-700:
			200: rank-veteran
			400: rank-veteran
			800: rank-veteran
			1600: rank-veteran
	GrantCondition@RANK-ELITE:
		RequiresCondition: rank-veteran >= 4
	FirepowerMultiplier@RANK-1:
		Modifier: 110
	FirepowerMultiplier@RANK-2:
		Modifier: 115
	FirepowerMultiplier@RANK-3:
		RequiresCondition: rank-veteran == 3
		Modifier: 120
	FirepowerMultiplier@RANK-ELITE:
		Modifier: 130
	DamageMultiplier@RANK-1:
		RequiresCondition: rank-veteran == 1
		Modifier: 91
	DamageMultiplier@RANK-2:
		Modifier: 87
	DamageMultiplier@RANK-3:
		RequiresCondition: rank-veteran == 3
		Modifier: 83
	DamageMultiplier@RANK-ELITE:
		Modifier: 65
	SpeedMultiplier@RANK-1:
		RequiresCondition: rank-veteran == 1
		Modifier: 110
	SpeedMultiplier@RANK-2:
		RequiresCondition: rank-veteran == 2
		Modifier: 115
	SpeedMultiplier@RANK-3:
		RequiresCondition: rank-veteran == 3
		Modifier: 120
	SpeedMultiplier@RANK-ELITE:
		Modifier: 150
	ReloadDelayMultiplier@RANK-1:
		RequiresCondition: rank-veteran == 1
		Modifier: 95
	ReloadDelayMultiplier@RANK-2:
		RequiresCondition: rank-veteran == 2
		Modifier: 90
	ReloadDelayMultiplier@RANK-3:
		RequiresCondition: rank-veteran == 3
		Modifier: 85
	ReloadDelayMultiplier@RANK-ELITE:
		RequiresCondition: rank-elite
		Modifier: 75
	InaccuracyMultiplier@RANK-1:
		RequiresCondition: rank-veteran == 1
		Modifier: 90
	InaccuracyMultiplier@RANK-2:
		RequiresCondition: rank-veteran == 2
		Modifier: 80
	InaccuracyMultiplier@RANK-3:
		RequiresCondition: rank-veteran == 3
		Modifier: 70
	InaccuracyMultiplier@RANK-ELITE:
		RequiresCondition: rank-elite
		Modifier: 50
	-RangeMultiplier@RANK-ELITE:
	-RevealsShroudMultiplier@RANK-ELITE:
	ChangesHealth@ELITE:
		Step: 200
		PercentageStep: 0
		Delay: 100
		StartIfBelow: 100
		DamageCooldown: 125
	WithDecoration@RANK-3:
		Image: rank
		Sequence: rank-veteran-3
		Palette: effect
		Position: BottomRight
		Margin: 5, 6
		ValidRelationships: Ally, Enemy, Neutral
		RequiresCondition: rank-veteran == 3

# The infantry rank pips blink with the hospital and hazmat decorations; the new third rank blinks the same way.
^InfantryExperienceHospitalHazmatOverrides:
	WithDecoration@RANK-3:
		BlinkInterval: 32
		BlinkPatterns:
			hospitalheal && hazmatsuits: On, Off, Off
			hospitalheal || hazmatsuits: On, Off

