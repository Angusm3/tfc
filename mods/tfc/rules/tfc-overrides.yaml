# ---------------------------------------------------------------------------------------------------------------
# Lane 4e: the stock actors and templates TFC changed, written with their 0.32 effective values (design note 2.2).
# Units: health and damage x100, turn speeds x4. Queue types: 0.32 'Defence.*' is 20250330 'Support.*'.
