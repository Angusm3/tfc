# Assault APC passenger variants (0.32 rules/assault_apc.yaml). The ten loadouts are cosmetic copies of APC with an extra M16.
# 0.32 did not enable the TransformOnPassenger trigger on the base APC, so these are unbuildable and only placed by maps or scripts.

APC.E1:
	Inherits: APC
	Tooltip:
		Name: actor-apc-e1-name
	-Buildable:
	-Encyclopedia:
	RenderSprites:
		Image: apc
	Armament@2:
		Name: 2
		Weapon: M16
