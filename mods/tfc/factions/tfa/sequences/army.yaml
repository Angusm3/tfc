mgnst:
	Defaults:
		Filename: mgnst.shp
	# The sprite has 28 drawn facings; 20250330 needs a power of two. 32 facings, each mapped to the nearest drawn frame
	# (round(i * 28 / 32)). If the turret turns the wrong way in game, use Facings: -32.
	# The file is idle 0-27, recoil 28-55 (idle plus muzzle flash), damaged-idle 56-63, damaged-recoil 64-71 (8 facings each);
	# 0.32 read recoil from 29 and damaged-idle from 57, one frame late.
	idle:
		Facings: 32
		Frames: 0, 1, 2, 3, 4, 4, 5, 6, 7, 8, 9, 10, 11, 11, 12, 13, 14, 15, 16, 17, 18, 18, 19, 20, 21, 22, 23, 24, 25, 25, 26, 27
	recoil:
		Facings: 32
		Frames: 28, 29, 30, 31, 32, 32, 33, 34, 35, 36, 37, 38, 39, 39, 40, 41, 42, 43, 44, 45, 46, 46, 47, 48, 49, 50, 51, 52, 53, 53, 54, 55
	damaged-idle:
		Start: 56
		Facings: 8
	damaged-recoil:
		Start: 64
		Facings: 8
	make:
		Length: 1
		Tick: 80
	muzzle:
		Filename: gunfire2.shp
		Length: *
	icon:
		Filename: mgnsticon.shp

