		Prerequisites: anyhq
		Description: actor-huey.description
	Selectable:
		DecorationBounds: 1280, 1024
	Aircraft:
		TurnSpeed: 20
		Speed: 140
		IdleBehavior: Land
	# Q-K default: 0.32 named 'hpad, fhpad' (typo); it rearmed at hpad only.
	Rearmable:
		RearmActors: hpad
	Health:
		HP: 10000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 10c0
		Type: GroundPosition
	Armament@PRIMARY:
		Weapon: Hrockets
		LocalOffset: 128,-213,-85, 128,213,-85
		MuzzleSequence: muzzle
	AttackMove:
		Voice: Attack
	AttackAircraft:
		FacingTolerance: 80
		AttackType: Hover
		Voice: Attack
	WithMuzzleOverlay:
	WithIdleOverlay@ROTORAIR:
		Offset: 300,0,85
		Sequence: rotor
		RequiresCondition: airborne
	WithIdleOverlay@ROTORGROUND:
		Offset: 300,0,85
