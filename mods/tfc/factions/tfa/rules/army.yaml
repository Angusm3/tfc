# The Forgotten (tfa): units, structures, husks and the two Forgotten templates, ported from legacy-0.32/factions/tfa/rules/army.yaml
# plus ^ForgottenInfantry / ^ForgottenBuilding (0.32 rules/defaults.yaml), FOXHOLE (0.32 rules/structures.yaml) and the three
# Forgotten husks (0.32 rules/husks.yaml). Values are the 0.32 effective ones from tools/baseline-0.32-actors.csv
# (health and damage x100, turn speeds x4). The 0.32 FACT, TRAN, SILO and BRIK blocks in that file belong to lane 4e.
# Not here (Phase 5a): the Forgotten as a lobby faction, starting units, AI.

# ---------------------------------------------------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------------------------------------------------

# 0.32 ^ForgottenInfantry: an ^Infantry with Forgotten terrain speeds (locomotor 'forgottenfoot', added by S2).
# Experience, auto-targeting and the hospital/hazmat decorations are inherited by each armed actor (as stock E1 does),
# because hjkr had -GainsExperience and -AutoTarget in 0.32.
^ForgottenInfantry:
	Inherits: ^Soldier
	Mobile:
		Locomotor: forgottenfoot
	DetectCloaked:
		Range: 1c0

# 0.32 ^ForgottenBuilding: a ^BaseBuilding that may also be built on Tiberium and that the Forgotten combat engineer
# (cmbt) can capture from outside ("Use modern mechanics": modelled on RA E6 Captures and the RA ^Building capture bar).
# It keeps the stock Capturable (building-sabotage), so ordinary engineers can still sabotage it.
^ForgottenBuilding:
	Inherits: ^BaseBuilding
	Building:
		TerrainTypes: Clear, Road, Tiberium, BlueTiberium
	SpawnActorsOnSell:
		ActorTypes: cmbt, militia
	CaptureManager:
	Capturable@FORGOTTEN:
		RequiresCondition: !build-incomplete
		Types: forgotten-building
	CapturableProgressBar:
	CapturableProgressBlink:

