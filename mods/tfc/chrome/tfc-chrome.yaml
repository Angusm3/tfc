# TFC chrome collections (Phase 5b). Loaded after chrome.yaml, so these merge over the stock cnc ones.

# Faction flags. The engine reads every faction flag from the one collection named 'flags', and a
# collection has a single sheet, so the whole collection moves to TFC's own 0.32 sheet (a byte-identical
# copy of legacy-0.32/uibits/chrome.png). It holds GDI, Nod, the Forgotten and a Random flag that
# carries all three emblems. Regions are 0.32's own. The stock 2x and 3x sheets are dropped because
# they have a different layout.
flags:
	Image: tfc-legacy-sheet.png
	-Image2x:
	-Image3x:
	Regions:
		nod: 352, 0, 32, 16
		gdi: 352, 16, 32, 16
		forgotten: 322, 128, 32, 16
		Random: 352, 32, 32, 16

# 'forgotten-load' from 0.32's sheet. 0.32 pointed it at 768,256 (blank); the green emblem is at 512,256.
tfc-logos:
	Image: tfc-legacy-sheet.png
	Regions:
		forgotten-load: 512, 256, 256, 256

# Stock cnc has the lightning-bolt icons in its sheet but no region for them (ra has 'power').
order-icons:
	Regions:
		power: 938, 68, 16, 16
		power-disabled: 938, 85, 16, 16
		power-active: 938, 102, 16, 16

# The Forgotten have no interface art of their own (no new art is drawn in this pass): every *-forgotten collection
# points at the same sheet and regions as its *-gdi counterpart in stock cnc chrome.yaml (generated by renaming
